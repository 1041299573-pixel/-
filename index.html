<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>手势人物互动</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    /* 摄像头铺满整个画面 */
    #video {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      /* 镜像 */
      transform: scaleX(-1);

      z-index: 1;
    }

    /* ================================
       人物
       ================================ */

    .character {
      position: fixed;

      left: 50%;
      top: 50%;

      /*
        原来 430 × 430
        现在接近放大两倍
      */
      width: 800px;
      height: 800px;

      /*
        P1 / P2 都使用同一个显示框，
        所以切换时不会突然改变尺寸。
      */
      object-fit: contain;

      transform: translate(-50%, -50%);

      pointer-events: none;
      user-select: none;

      z-index: 10;

      display: none;

      will-change: left, top;
    }

    /* 状态提示 */
    #status {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      padding: 10px 18px;

      color: white;
      background: rgba(0, 0, 0, 0.68);

      border-radius: 999px;

      font-size: 15px;

      z-index: 100;

      pointer-events: none;

      white-space: nowrap;
    }

    /* 手机 */
    @media (max-width: 700px) {
      .character {
        width: 560px;
        height: 560px;
      }
    }
  </style>
</head>

<body>

  <!-- 摄像头 -->
  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>


  <!-- 第一只手 -->
  <img
    id="character1"
    class="character"
    src="p1.png"
    alt=""
  />


  <!-- 第二只手 -->
  <img
    id="character2"
    class="character"
    src="p1.png"
    alt=""
  />


  <div id="status">
    👋 请把手放进摄像头
  </div>


  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


  <script>

    const video =
      document.getElementById("video");

    const character1 =
      document.getElementById("character1");

    const character2 =
      document.getElementById("character2");

    const status =
      document.getElementById("status");


    /*
    ========================================
    人物当前位置
    ========================================
    */

    let hand1X =
      window.innerWidth * 0.35;

    let hand1Y =
      window.innerHeight * 0.5;


    let hand2X =
      window.innerWidth * 0.65;

    let hand2Y =
      window.innerHeight * 0.5;


    /*
    ========================================
    上一帧目标位置

    用来过滤摄像头产生的小幅抖动
    ========================================
    */

    let lastTarget1X = null;
    let lastTarget1Y = null;

    let lastTarget2X = null;
    let lastTarget2Y = null;


    /*
    ========================================
    当前手势状态

    false = P1
    true  = P2
    ========================================
    */

    let hand1Open = false;
    let hand2Open = false;


    /*
    ========================================
    手势连续确认计数

    防止 P1 / P2 疯狂闪烁
    ========================================
    */

    let hand1OpenFrames = 0;
    let hand1ClosedFrames = 0;

    let hand2OpenFrames = 0;
    let hand2ClosedFrames = 0;


    /*
    ========================================
    获取手掌中心
    ========================================
    */

    function getPalmCenter(hand) {

      const points = [
        hand[0],
        hand[5],
        hand[9],
        hand[13],
        hand[17]
      ];


      let x = 0;
      let y = 0;


      for (const point of points) {

        x += point.x;
        y += point.y;

      }


      return {

        x: x / points.length,
        y: y / points.length

      };
    }


    /*
    ========================================
    计算手掌展开程度
    ========================================
    */

    function getHandOpenRatio(hand) {

      const wrist =
        hand[0];


      const fingertips = [

        hand[4],
        hand[8],
        hand[12],
        hand[16],
        hand[20]

      ];


      let fingerDistance = 0;


      for (const tip of fingertips) {

        fingerDistance += Math.hypot(

          tip.x - wrist.x,
          tip.y - wrist.y

        );

      }


      fingerDistance /=
        fingertips.length;


      /*
        手掌宽度作为参考

        避免手靠近摄像头时
        判断标准发生巨大变化
      */

      const palmWidth =
        Math.hypot(

          hand[5].x - hand[17].x,
          hand[5].y - hand[17].y

        );


      if (palmWidth < 0.001) {

        return 0;

      }


      return (
        fingerDistance /
        palmWidth
      );
    }


    /*
    ========================================
    稳定判断 P1 / P2
    ========================================

    使用两个阈值：

    > 2.20
    才认为正在展开

    < 2.05
    才认为正在聚拢

    中间区域维持原状态。

    这样可以明显减少闪烁。
    ========================================
    */

    function updateGestureState(
      hand,
      number
    ) {

      const ratio =
        getHandOpenRatio(hand);


      const OPEN_THRESHOLD = 2.20;
      const CLOSE_THRESHOLD = 2.05;


      /*
        连续 3 帧确认之后
        才真正切换图片
      */

      const CONFIRM_FRAMES = 3;


      if (number === 1) {

        if (ratio > OPEN_THRESHOLD) {

          hand1OpenFrames++;
          hand1ClosedFrames = 0;


          if (
            hand1OpenFrames >=
            CONFIRM_FRAMES
          ) {

            hand1Open = true;

          }

        }

        else if (
          ratio < CLOSE_THRESHOLD
        ) {

          hand1ClosedFrames++;
          hand1OpenFrames = 0;


          if (
            hand1ClosedFrames >=
            CONFIRM_FRAMES
          ) {

            hand1Open = false;

          }

        }

        else {

          hand1OpenFrames = 0;
          hand1ClosedFrames = 0;

        }


        return hand1Open;

      }


      else {

        if (ratio > OPEN_THRESHOLD) {

          hand2OpenFrames++;
          hand2ClosedFrames = 0;


          if (
            hand2OpenFrames >=
            CONFIRM_FRAMES
          ) {

            hand2Open = true;

          }

        }

        else if (
          ratio < CLOSE_THRESHOLD
        ) {

          hand2ClosedFrames++;
          hand2OpenFrames = 0;


          if (
            hand2ClosedFrames >=
            CONFIRM_FRAMES
          ) {

            hand2Open = false;

          }

        }

        else {

          hand2OpenFrames = 0;
          hand2ClosedFrames = 0;

        }


        return hand2Open;

      }
    }


    /*
    ========================================
    稳定人物移动
    ========================================
    */

    function moveCharacter(
      character,
      targetX,
      targetY,
      number
    ) {


      /*
        平滑值

        原来：0.38

        现在：0.24

        数值降低之后，
        人物会更稳、更柔和。
      */

      const smooth = 0.24;


      /*
        小抖动过滤

        手的位置变化小于这个距离时，
        直接忽略。
      */

      const deadZone = 4;


      if (number === 1) {


        /*
          如果上一帧存在，
          判断是不是只是轻微抖动。
        */

        if (
          lastTarget1X !== null
        ) {

          const distance =
            Math.hypot(

              targetX - lastTarget1X,
              targetY - lastTarget1Y

            );


          if (
            distance < deadZone
          ) {

            targetX =
              lastTarget1X;

            targetY =
              lastTarget1Y;

          }

        }


        lastTarget1X =
          targetX;

        lastTarget1Y =
          targetY;


        /*
          平滑移动
        */

        hand1X +=
          (targetX - hand1X) *
          smooth;

        hand1Y +=
          (targetY - hand1Y) *
          smooth;


        character.style.left =
          hand1X + "px";

        character.style.top =
          hand1Y + "px";

      }


      else {


        if (
          lastTarget2X !== null
        ) {

          const distance =
            Math.hypot(

              targetX - lastTarget2X,
              targetY - lastTarget2Y

            );


          if (
            distance < deadZone
          ) {

            targetX =
              lastTarget2X;

            targetY =
              lastTarget2Y;

          }

        }


        lastTarget2X =
          targetX;

        lastTarget2Y =
          targetY;


        hand2X +=
          (targetX - hand2X) *
          smooth;

        hand2Y +=
          (targetY - hand2Y) *
          smooth;


        character.style.left =
          hand2X + "px";

        character.style.top =
          hand2Y + "px";

      }
    }


    /*
    ========================================
    MediaPipe
    ========================================
    */

    const hands =
      new Hands({

        locateFile: (file) => {

          return (

            "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
            file

          );

        }

      });


    hands.setOptions({

      maxNumHands: 2,

      modelComplexity: 1,

      /*
        稍微提高置信度

        减少错误识别
      */

      minDetectionConfidence: 0.72,

      minTrackingConfidence: 0.72

    });


    /*
    ========================================
    每一帧识别结果
    ========================================
    */

    hands.onResults((results) => {


      const detectedHands =
        results.multiHandLandmarks || [];


      /*
        每帧先隐藏。

        只有摄像头真的识别到手，
        人物才出现。
      */

      character1.style.display =
        "none";

      character2.style.display =
        "none";


      /*
        没有检测到手
      */

      if (
        detectedHands.length === 0
      ) {

        status.innerText =
          "👋 请把手放进摄像头";

        return;

      }


      /*
        最多处理两只手
      */

      for (
        let i = 0;
        i < detectedHands.length &&
        i < 2;
        i++
      ) {


        const hand =
          detectedHands[i];


        const character =
          i === 0
            ? character1
            : character2;


        /*
          手掌中心
        */

        const palm =
          getPalmCenter(hand);


        /*
          摄像头进行了镜像，
          所以 X 坐标也镜像。
        */

        const screenX =
          (1 - palm.x) *
          window.innerWidth;


        const screenY =
          palm.y *
          window.innerHeight;


        /*
          稳定版手势判断
        */

        const opened =
          updateGestureState(
            hand,
            i + 1
          );


        /*
          展开 = P2

          聚拢 = P1
        */

        const wantedImage =
          opened
            ? "p2.png"
            : "p1.png";


        /*
          只有真正切换时
          才修改图片。
        */

        if (
          !character.src.endsWith(
            wantedImage
          )
        ) {

          character.src =
            wantedImage;

        }


        /*
          显示人物
        */

        character.style.display =
          "block";


        /*
          移动人物
        */

        moveCharacter(

          character,

          screenX,
          screenY,

          i + 1

        );

      }


      /*
      ========================================
      状态
      ========================================
      */

      if (
        detectedHands.length >= 2
      ) {

        status.innerText =
          "👐 双手已识别";

      }


      else {

        const opened =
          hand1Open;


        status.innerText =
          opened
            ? "✋ 手掌展开 · P2"
            : "✊ 手指聚拢 · P1";

      }

    });


    /*
    ========================================
    开启摄像头
    ========================================
    */

    const camera =
      new Camera(
        video,
        {

          onFrame:
            async () => {

              await hands.send({
                image: video
              });

            },

          width: 1280,
          height: 720

        }
      );


    camera.start();


    /*
    ========================================
    浏览器尺寸变化
    ========================================
    */

    window.addEventListener(
      "resize",
      () => {

        hand1X =
          Math.min(
            hand1X,
            window.innerWidth
          );

        hand1Y =
          Math.min(
            hand1Y,
            window.innerHeight
          );


        hand2X =
          Math.min(
            hand2X,
            window.innerWidth
          );

        hand2Y =
          Math.min(
            hand2Y,
            window.innerHeight
          );

      }
    );

  </script>

</body>
</html>
