<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大俊展翅</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    /* 摄像头 */
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    /* P1 / P2 */
    .character {
      position: fixed;
      left: 50%;
      top: 50%;

      width: 800px;
      height: 800px;

      object-fit: contain;

      transform: translate(-50%, -50%);

      pointer-events: none;
      user-select: none;

      z-index: 10;

      display: none;

      will-change: left, top;
    }

    /* =========================================
       P3 王冠测试
       强制放在画面正中央
       ========================================= */

    #crown {
      position: fixed !important;

      left: 50% !important;
      top: 50% !important;

      width: 400px !important;
      height: auto !important;

      transform: translate(-50%, -50%) !important;

      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      pointer-events: none;

      /*
        故意设置得非常高
        保证压在摄像头、人物、烟花上面
      */
      z-index: 999999 !important;
    }

    /* 烟花 */
    #fireworks {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 20;
    }

    /* 状态 */
    #status {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      padding: 10px 18px;

      color: white;
      background: rgba(0, 0, 0, 0.68);

      border-radius: 999px;

      font-size: 15px;

      z-index: 1000000;

      pointer-events: none;

      white-space: nowrap;
    }

    @media (max-width: 700px) {

      .character {
        width: 560px;
        height: 560px;
      }

      #crown {
        width: 300px !important;
      }
    }
  </style>
</head>


<body>

  <!-- 摄像头 -->
  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>


  <!-- P1 -->
  <img
    id="character1"
    class="character"
    src="p1.png"
    alt=""
  >


  <!-- P2 -->
  <img
    id="character2"
    class="character"
    src="p1.png"
    alt=""
  >


  <!-- 烟花 -->
  <canvas id="fireworks"></canvas>


  <!--
      P3 王冠

      这里直接使用已经确认
      可以访问的线上图片
  -->
  <img
    id="crown"
    src="https://1041299573-pixel.github.io/-/p3.png"
    alt="王冠"
  >


  <!-- 背景音乐 -->
  <audio
    id="bgMusic"
    src="https://1041299573-pixel.github.io/-/firework.mp3"
    preload="auto"
    loop
    playsinline
  ></audio>


  <div id="status">
    👋 请把手放进摄像头
  </div>


  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


  <script>

    /* =========================================
       元素
       ========================================= */

    const video =
      document.getElementById("video");

    const character1 =
      document.getElementById("character1");

    const character2 =
      document.getElementById("character2");

    const status =
      document.getElementById("status");

    const canvas =
      document.getElementById("fireworks");

    const ctx =
      canvas.getContext("2d");

    const bgMusic =
      document.getElementById("bgMusic");


    /* =========================================
       音乐
       ========================================= */

    bgMusic.volume = 0.8;

    let musicStarted = false;


    async function startMusic() {

      if (musicStarted) {
        return;
      }

      try {

        await bgMusic.play();

        musicStarted = true;

      }

      catch (error) {

        console.log("等待用户操作后播放音乐");

      }
    }


    window.addEventListener(
      "load",
      startMusic
    );


    bgMusic.addEventListener(
      "canplaythrough",
      startMusic
    );


    document.addEventListener(
      "pointerdown",
      startMusic
    );


    document.addEventListener(
      "click",
      startMusic
    );


    document.addEventListener(
      "touchstart",
      startMusic,
      { passive: true }
    );


    document.addEventListener(
      "keydown",
      startMusic
    );


    window.addEventListener(
      "focus",
      startMusic
    );


    startMusic();


    /* =========================================
       Canvas
       ========================================= */

    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

    }


    resizeCanvas();


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    /* =========================================
       人物位置
       ========================================= */

    let hand1X =
      window.innerWidth * 0.35;

    let hand1Y =
      window.innerHeight * 0.5;


    let hand2X =
      window.innerWidth * 0.65;

    let hand2Y =
      window.innerHeight * 0.5;


    let lastTarget1X = null;
    let lastTarget1Y = null;

    let lastTarget2X = null;
    let lastTarget2Y = null;


    /* =========================================
       手势状态
       ========================================= */

    let hand1Open = false;
    let hand2Open = false;

    let hand1OpenFrames = 0;
    let hand1ClosedFrames = 0;

    let hand2OpenFrames = 0;
    let hand2ClosedFrames = 0;


    /* =========================================
       手掌中心
       ========================================= */

    function getPalmCenter(hand) {

      const points = [
        hand[0],
        hand[5],
        hand[9],
        hand[13],
        hand[17]
      ];


      let x = 0;
      let y = 0;


      for (const point of points) {

        x += point.x;
        y += point.y;

      }


      return {

        x: x / points.length,
        y: y / points.length

      };
    }


    /* =========================================
       判断手掌展开程度
       ========================================= */

    function getHandOpenRatio(hand) {

      const wrist =
        hand[0];


      const fingertips = [
        hand[4],
        hand[8],
        hand[12],
        hand[16],
        hand[20]
      ];


      let fingerDistance = 0;


      for (const tip of fingertips) {

        fingerDistance += Math.hypot(

          tip.x - wrist.x,
          tip.y - wrist.y

        );
      }


      fingerDistance /=
        fingertips.length;


      const palmWidth =
        Math.hypot(

          hand[5].x - hand[17].x,
          hand[5].y - hand[17].y

        );


      if (palmWidth < 0.001) {

        return 0;

      }


      return (
        fingerDistance /
        palmWidth
      );
    }


    /* =========================================
       稳定手势
       ========================================= */

    function updateGesture(
      hand,
      number
    ) {

      const ratio =
        getHandOpenRatio(hand);


      const OPEN_THRESHOLD =
        2.20;

      const CLOSE_THRESHOLD =
        2.05;

      const CONFIRM_FRAMES =
        3;


      let changedToOpen =
        false;


      /* 第一只手 */

      if (number === 1) {

        const previous =
          hand1Open;


        if (
          ratio >
          OPEN_THRESHOLD
        ) {

          hand1OpenFrames++;

          hand1ClosedFrames = 0;


          if (
            hand1OpenFrames >=
            CONFIRM_FRAMES
          ) {

            hand1Open = true;

          }
        }


        else if (
          ratio <
          CLOSE_THRESHOLD
        ) {

          hand1ClosedFrames++;

          hand1OpenFrames = 0;


          if (
            hand1ClosedFrames >=
            CONFIRM_FRAMES
          ) {

            hand1Open = false;

          }
        }


        else {

          hand1OpenFrames = 0;
          hand1ClosedFrames = 0;

        }


        if (
          previous === false &&
          hand1Open === true
        ) {

          changedToOpen = true;

        }


        return {

          opened:
            hand1Open,

          changedToOpen:
            changedToOpen

        };
      }


      /* 第二只手 */

      else {

        const previous =
          hand2Open;


        if (
          ratio >
          OPEN_THRESHOLD
        ) {

          hand2OpenFrames++;

          hand2ClosedFrames = 0;


          if (
            hand2OpenFrames >=
            CONFIRM_FRAMES
          ) {

            hand2Open = true;

          }
        }


        else if (
          ratio <
          CLOSE_THRESHOLD
        ) {

          hand2ClosedFrames++;

          hand2OpenFrames = 0;


          if (
            hand2ClosedFrames >=
            CONFIRM_FRAMES
          ) {

            hand2Open = false;

          }
        }


        else {

          hand2OpenFrames = 0;
          hand2ClosedFrames = 0;

        }


        if (
          previous === false &&
          hand2Open === true
        ) {

          changedToOpen = true;

        }


        return {

          opened:
            hand2Open,

          changedToOpen:
            changedToOpen

        };
      }
    }


    /* =========================================
       人物移动
       ========================================= */

    function moveCharacter(
      character,
      targetX,
      targetY,
      number
    ) {

      const smooth =
        0.24;

      const deadZone =
        4;


      if (number === 1) {

        if (
          lastTarget1X !== null
        ) {

          const distance =
            Math.hypot(

              targetX - lastTarget1X,
              targetY - lastTarget1Y

            );


          if (
            distance <
            deadZone
          ) {

            targetX =
              lastTarget1X;

            targetY =
              lastTarget1Y;

          }
        }


        lastTarget1X =
          targetX;

        lastTarget1Y =
          targetY;


        hand1X +=
          (targetX - hand1X) *
          smooth;


        hand1Y +=
          (targetY - hand1Y) *
          smooth;


        character.style.left =
          hand1X + "px";

        character.style.top =
          hand1Y + "px";

      }


      else {

        if (
          lastTarget2X !== null
        ) {

          const distance =
            Math.hypot(

              targetX - lastTarget2X,
              targetY - lastTarget2Y

            );


          if (
            distance <
            deadZone
          ) {

            targetX =
              lastTarget2X;

            targetY =
              lastTarget2Y;

          }
        }


        lastTarget2X =
          targetX;

        lastTarget2Y =
          targetY;


        hand2X +=
          (targetX - hand2X) *
          smooth;


        hand2Y +=
          (targetY - hand2Y) *
          smooth;


        character.style.left =
          hand2X + "px";

        character.style.top =
          hand2Y + "px";

      }
    }


    /* =========================================
       轻量烟花
       ========================================= */

    const particles = [];


    const colors = [

      "#ffffff",
      "#ffd54a",
      "#ff7a45",
      "#ff4f9a",
      "#72f6ff",
      "#a78bfa"

    ];


    function createFirework(
      x,
      y
    ) {

      const amount =
        75;


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        const angle =
          Math.random() *
          Math.PI *
          2;


        const speed =
          3 +
          Math.random() *
          9;


        const color =
          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];


        particles.push({

          x: x,
          y: y,

          vx:
            Math.cos(angle) *
            speed,

          vy:
            Math.sin(angle) *
            speed,

          size:
            2 +
            Math.random() *
            5,

          life:
            1,

          decay:
            0.014 +
            Math.random() *
            0.018,

          color:
            color

        });
      }
    }


    function animateFireworks() {

      ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

      );


      for (
        let i =
          particles.length - 1;

        i >= 0;

        i--
      ) {

        const p =
          particles[i];


        p.x += p.vx;
        p.y += p.vy;


        p.vx *= 0.985;
        p.vy *= 0.985;

        p.vy += 0.08;

        p.life -= p.decay;


        if (
          p.life <= 0
        ) {

          particles.splice(
            i,
            1
          );

          continue;
        }


        ctx.save();

        ctx.globalAlpha =
          p.life;

        ctx.fillStyle =
          p.color;

        ctx.shadowColor =
          p.color;

        ctx.shadowBlur =
          10;


        ctx.beginPath();


        ctx.arc(

          p.x,
          p.y,

          p.size,

          0,
          Math.PI * 2

        );


        ctx.fill();

        ctx.restore();
      }


      requestAnimationFrame(
        animateFireworks
      );
    }


    animateFireworks();


    /* =========================================
       MediaPipe
       ========================================= */

    const hands =
      new Hands({

        locateFile:
          (file) => {

            return (

              "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
              file

            );
          }
      });


    hands.setOptions({

      maxNumHands:
        2,

      modelComplexity:
        1,

      minDetectionConfidence:
        0.72,

      minTrackingConfidence:
        0.72

    });


    /* =========================================
       识别结果
       ========================================= */

    hands.onResults(
      (results) => {

        const detectedHands =
          results.multiHandLandmarks
          || [];


        character1.style.display =
          "none";

        character2.style.display =
          "none";


        if (
          detectedHands.length === 0
        ) {

          status.innerText =
            "👋 请把手放进摄像头";

          return;
        }


        for (
          let i = 0;

          i <
          detectedHands.length &&
          i < 2;

          i++
        ) {

          const hand =
            detectedHands[i];


          const character =
            i === 0
              ? character1
              : character2;


          const palm =
            getPalmCenter(hand);


          const screenX =
            (1 - palm.x) *
            window.innerWidth;


          const screenY =
            palm.y *
            window.innerHeight;


          const gesture =
            updateGesture(
              hand,
              i + 1
            );


          /*
            聚拢 = P1
            展开 = P2
          */

          const wantedImage =
            gesture.opened
              ? "p2.png"
              : "p1.png";


          if (
            !character.src.endsWith(
              wantedImage
            )
          ) {

            character.src =
              wantedImage;

          }


          character.style.display =
            "block";


          moveCharacter(

            character,

            screenX,
            screenY,

            i + 1

          );


          /*
            P1 → P2 时烟花
          */

          if (
            gesture.changedToOpen
          ) {

            createFirework(

              screenX,
              screenY

            );
          }
        }


        if (
          detectedHands.length >= 2
        ) {

          status.innerText =
            "👐 双手已识别";

        }

        else {

          status.innerText =
            hand1Open
              ? "🎆 手掌展开 · P2"
              : "✊ 手指聚拢 · P1";

        }
      }
    );


    /* =========================================
       摄像头
       ========================================= */

    const camera =
      new Camera(
        video,
        {

          onFrame:
            async () => {

              await hands.send({
                image: video
              });

            },

          width:
            1280,

          height:
            720

        }
      );


    camera.start();

  </script>

</body>
</html>
