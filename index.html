<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>手势人物互动</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    /* 摄像头 */
    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    /* 人物 */
    .character {
      position: fixed;
      left: 50%;
      top: 50%;

      width: 800px;
      height: 800px;

      object-fit: contain;

      transform: translate(-50%, -50%);

      pointer-events: none;
      user-select: none;

      z-index: 10;

      display: none;

      will-change: left, top;
    }

    /* 烟花 */
    #fireworks {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 20;
    }

    /* 状态提示 */
    #status {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      padding: 10px 18px;

      color: white;

      background: rgba(0, 0, 0, 0.68);

      border-radius: 999px;

      font-size: 15px;

      z-index: 100;

      pointer-events: none;

      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .character {
        width: 560px;
        height: 560px;
      }
    }
  </style>
</head>

<body>

  <!-- 摄像头 -->
  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>


  <!-- 第一只手控制的人物 -->
  <img
    id="character1"
    class="character"
    src="p1.png"
    alt=""
  >


  <!-- 第二只手控制的人物 -->
  <img
    id="character2"
    class="character"
    src="p1.png"
    alt=""
  >


  <!-- 烟花 -->
  <canvas id="fireworks"></canvas>


  <!-- =========================
       背景音乐

       firework.mp3 = 整首歌曲
       loop = 自动循环
       ========================= -->
  <audio
    id="bgMusic"
    src="firework.mp3"
    preload="auto"
    loop
  ></audio>


  <div id="status">
    👋 请把手放进摄像头
  </div>


  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


  <script>

    /* ==================================================
       获取元素
       ================================================== */

    const video =
      document.getElementById("video");

    const character1 =
      document.getElementById("character1");

    const character2 =
      document.getElementById("character2");

    const status =
      document.getElementById("status");

    const canvas =
      document.getElementById("fireworks");

    const ctx =
      canvas.getContext("2d");

    const bgMusic =
      document.getElementById("bgMusic");


    /* ==================================================
       背景音乐
       ================================================== */

    bgMusic.volume = 0.8;


    function startMusic() {

      if (!bgMusic.paused) {
        return;
      }

      bgMusic.play().catch(() => {
        /*
          如果浏览器阻止自动播放，
          等待用户第一次点击/触摸。
        */
      });

    }


    /*
      网页加载完成后
      立即尝试播放
    */

    window.addEventListener(
      "load",
      () => {

        startMusic();

      }
    );


    /*
      Chrome / Safari 如果阻止自动播放，
      第一次点击网页时自动开始。
    */

    document.addEventListener(
      "click",
      () => {

        startMusic();

      },
      { once: true }
    );


    document.addEventListener(
      "touchstart",
      () => {

        startMusic();

      },
      { once: true }
    );


    /*
      键盘操作也可以解锁音乐
    */

    document.addEventListener(
      "keydown",
      () => {

        startMusic();

      },
      { once: true }
    );


    /* ==================================================
       Canvas 尺寸
       ================================================== */

    function resizeCanvas() {

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

    }

    resizeCanvas();


    /* ==================================================
       人物位置
       ================================================== */

    let hand1X =
      window.innerWidth * 0.35;

    let hand1Y =
      window.innerHeight * 0.5;


    let hand2X =
      window.innerWidth * 0.65;

    let hand2Y =
      window.innerHeight * 0.5;


    let lastTarget1X = null;
    let lastTarget1Y = null;

    let lastTarget2X = null;
    let lastTarget2Y = null;


    /* ==================================================
       手势状态
       ================================================== */

    let hand1Open = false;
    let hand2Open = false;


    let hand1OpenFrames = 0;
    let hand1ClosedFrames = 0;

    let hand2OpenFrames = 0;
    let hand2ClosedFrames = 0;


    /* ==================================================
       获取手掌中心
       ================================================== */

    function getPalmCenter(hand) {

      const points = [

        hand[0],
        hand[5],
        hand[9],
        hand[13],
        hand[17]

      ];


      let x = 0;
      let y = 0;


      for (const point of points) {

        x += point.x;
        y += point.y;

      }


      return {

        x: x / points.length,
        y: y / points.length

      };

    }


    /* ==================================================
       获取手掌展开程度
       ================================================== */

    function getHandOpenRatio(hand) {

      const wrist =
        hand[0];


      const fingertips = [

        hand[4],
        hand[8],
        hand[12],
        hand[16],
        hand[20]

      ];


      let fingerDistance = 0;


      for (const tip of fingertips) {

        fingerDistance += Math.hypot(

          tip.x - wrist.x,
          tip.y - wrist.y

        );

      }


      fingerDistance /=
        fingertips.length;


      const palmWidth =
        Math.hypot(

          hand[5].x - hand[17].x,
          hand[5].y - hand[17].y

        );


      if (palmWidth < 0.001) {

        return 0;

      }


      return (
        fingerDistance /
        palmWidth
      );

    }


    /* ==================================================
       稳定判断 P1 / P2
       ================================================== */

    function updateGesture(
      hand,
      number
    ) {

      const ratio =
        getHandOpenRatio(hand);


      /*
        张开超过这个值 → P2
      */

      const OPEN_THRESHOLD =
        2.20;


      /*
        聚拢低于这个值 → P1
      */

      const CLOSE_THRESHOLD =
        2.05;


      /*
        连续确认 3 帧，
        防止人物闪烁
      */

      const CONFIRM_FRAMES =
        3;


      let changedToOpen =
        false;


      /* =========================
         第一只手
         ========================= */

      if (number === 1) {

        const previous =
          hand1Open;


        if (
          ratio >
          OPEN_THRESHOLD
        ) {

          hand1OpenFrames++;

          hand1ClosedFrames = 0;


          if (
            hand1OpenFrames >=
            CONFIRM_FRAMES
          ) {

            hand1Open = true;

          }

        }


        else if (
          ratio <
          CLOSE_THRESHOLD
        ) {

          hand1ClosedFrames++;

          hand1OpenFrames = 0;


          if (
            hand1ClosedFrames >=
            CONFIRM_FRAMES
          ) {

            hand1Open = false;

          }

        }


        else {

          hand1OpenFrames = 0;
          hand1ClosedFrames = 0;

        }


        /*
          只有：

          P1 → P2

          才触发烟花
        */

        if (
          previous === false &&
          hand1Open === true
        ) {

          changedToOpen = true;

        }


        return {

          opened:
            hand1Open,

          changedToOpen:
            changedToOpen

        };

      }


      /* =========================
         第二只手
         ========================= */

      else {

        const previous =
          hand2Open;


        if (
          ratio >
          OPEN_THRESHOLD
        ) {

          hand2OpenFrames++;

          hand2ClosedFrames = 0;


          if (
            hand2OpenFrames >=
            CONFIRM_FRAMES
          ) {

            hand2Open = true;

          }

        }


        else if (
          ratio <
          CLOSE_THRESHOLD
        ) {

          hand2ClosedFrames++;

          hand2OpenFrames = 0;


          if (
            hand2ClosedFrames >=
            CONFIRM_FRAMES
          ) {

            hand2Open = false;

          }

        }


        else {

          hand2OpenFrames = 0;
          hand2ClosedFrames = 0;

        }


        if (
          previous === false &&
          hand2Open === true
        ) {

          changedToOpen = true;

        }


        return {

          opened:
            hand2Open,

          changedToOpen:
            changedToOpen

        };

      }

    }


    /* ==================================================
       人物移动
       ================================================== */

    function moveCharacter(
      character,
      targetX,
      targetY,
      number
    ) {

      /*
        数值越小越平滑
      */

      const smooth =
        0.24;


      /*
        小幅度抖动直接忽略
      */

      const deadZone =
        4;


      /* 第一只手 */

      if (number === 1) {

        if (
          lastTarget1X !== null
        ) {

          const distance =
            Math.hypot(

              targetX - lastTarget1X,
              targetY - lastTarget1Y

            );


          if (
            distance <
            deadZone
          ) {

            targetX =
              lastTarget1X;

            targetY =
              lastTarget1Y;

          }

        }


        lastTarget1X =
          targetX;

        lastTarget1Y =
          targetY;


        hand1X +=

          (targetX - hand1X) *
          smooth;


        hand1Y +=

          (targetY - hand1Y) *
          smooth;


        character.style.left =
          hand1X + "px";

        character.style.top =
          hand1Y + "px";

      }


      /* 第二只手 */

      else {

        if (
          lastTarget2X !== null
        ) {

          const distance =
            Math.hypot(

              targetX - lastTarget2X,
              targetY - lastTarget2Y

            );


          if (
            distance <
            deadZone
          ) {

            targetX =
              lastTarget2X;

            targetY =
              lastTarget2Y;

          }

        }


        lastTarget2X =
          targetX;

        lastTarget2Y =
          targetY;


        hand2X +=

          (targetX - hand2X) *
          smooth;


        hand2Y +=

          (targetY - hand2Y) *
          smooth;


        character.style.left =
          hand2X + "px";

        character.style.top =
          hand2Y + "px";

      }

    }


    /* ==================================================
       轻量烟花
       ================================================== */

    const particles = [];


    const colors = [

      "#ffffff",
      "#ffd54a",
      "#ff7a45",
      "#ff4f9a",
      "#72f6ff",
      "#a78bfa"

    ];


    /* ==================================================
       创建烟花
       ================================================== */

    function createFirework(
      x,
      y
    ) {

      /*
        保持之前不卡的版本：
        75 个粒子
      */

      const amount =
        75;


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        const angle =

          Math.random() *
          Math.PI *
          2;


        const speed =

          3 +
          Math.random() *
          9;


        const color =

          colors[
            Math.floor(
              Math.random() *
              colors.length
            )
          ];


        particles.push({

          x: x,

          y: y,


          vx:

            Math.cos(angle) *
            speed,


          vy:

            Math.sin(angle) *
            speed,


          size:

            2 +
            Math.random() *
            5,


          life:
            1,


          decay:

            0.014 +
            Math.random() *
            0.018,


          color:
            color

        });

      }

      /*
        注意：

        这里已经没有播放 firework.mp3！

        因为 firework.mp3
        现在是整首背景音乐。
      */

    }


    /* ==================================================
       烟花动画
       ================================================== */

    function animateFireworks() {

      ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

      );


      for (
        let i =
          particles.length - 1;

        i >= 0;

        i--
      ) {

        const p =
          particles[i];


        /* 移动 */

        p.x +=
          p.vx;

        p.y +=
          p.vy;


        /* 阻力 */

        p.vx *=
          0.985;

        p.vy *=
          0.985;


        /* 一点重力 */

        p.vy +=
          0.08;


        /* 消失 */

        p.life -=
          p.decay;


        if (
          p.life <= 0
        ) {

          particles.splice(
            i,
            1
          );

          continue;

        }


        ctx.save();


        ctx.globalAlpha =
          p.life;


        ctx.fillStyle =
          p.color;


        /*
          小范围发光
          保持轻量
        */

        ctx.shadowColor =
          p.color;

        ctx.shadowBlur =
          10;


        ctx.beginPath();


        ctx.arc(

          p.x,
          p.y,

          p.size,

          0,
          Math.PI * 2

        );


        ctx.fill();


        ctx.restore();

      }


      requestAnimationFrame(
        animateFireworks
      );

    }


    animateFireworks();


    /* ==================================================
       MediaPipe
       ================================================== */

    const hands =
      new Hands({

        locateFile:
          (file) => {

            return (

              "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" +
              file

            );

          }

      });


    hands.setOptions({

      maxNumHands:
        2,

      modelComplexity:
        1,

      minDetectionConfidence:
        0.72,

      minTrackingConfidence:
        0.72

    });


    /* ==================================================
       每一帧手势识别
       ================================================== */

    hands.onResults(
      (results) => {


        const detectedHands =

          results.multiHandLandmarks
          || [];


        character1.style.display =
          "none";

        character2.style.display =
          "none";


        /* 没有检测到手 */

        if (
          detectedHands.length === 0
        ) {

          status.innerText =
            "👋 请把手放进摄像头";

          return;

        }


        /* 最多处理两只手 */

        for (
          let i = 0;

          i <
          detectedHands.length &&
          i < 2;

          i++
        ) {


          const hand =
            detectedHands[i];


          const character =

            i === 0

              ? character1

              : character2;


          /* 手掌中心 */

          const palm =
            getPalmCenter(hand);


          /* 镜像坐标 */

          const screenX =

            (1 - palm.x) *
            window.innerWidth;


          const screenY =

            palm.y *
            window.innerHeight;


          /* 判断手势 */

          const gesture =

            updateGesture(
              hand,
              i + 1
            );


          /*
            手指聚拢 = P1
            手掌展开 = P2
          */

          const wantedImage =

            gesture.opened

              ? "p2.png"

              : "p1.png";


          if (
            !character.src.endsWith(
              wantedImage
            )
          ) {

            character.src =
              wantedImage;

          }


          /*
            P1 / P2 固定大小
            不进行任何缩放
          */

          character.style.display =
            "block";


          /* 人物跟随手掌 */

          moveCharacter(

            character,

            screenX,
            screenY,

            i + 1

          );


          /*
            P1 → P2 的瞬间
            只触发烟花

            不重新播放音乐
          */

          if (
            gesture.changedToOpen
          ) {

            createFirework(

              screenX,
              screenY

            );

          }

        }


        /* 状态提示 */

        if (
          detectedHands.length >= 2
        ) {

          status.innerText =
            "👐 双手已识别";

        }

        else {

          status.innerText =

            hand1Open

              ? "🎆 手掌展开 · P2"

              : "✊ 手指聚拢 · P1";

        }

      }
    );


    /* ==================================================
       开启摄像头
       ================================================== */

    const camera =
      new Camera(
        video,
        {

          onFrame:
            async () => {

              await hands.send({
                image: video
              });

            },

          width:
            1280,

          height:
            720

        }
      );


    camera.start();


    /* ==================================================
       浏览器尺寸变化
       ================================================== */

    window.addEventListener(
      "resize",
      () => {

        resizeCanvas();

      }
    );

  </script>

</body>
</html>
